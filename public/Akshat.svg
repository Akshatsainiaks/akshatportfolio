<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#080b12"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Left Stem Gradient (Electric Cyan -> Blue) -->
    <linearGradient id="leftStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Right Stem Gradient (Cyan -> Violet / Indigo) -->
    <linearGradient id="rightStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing Crossbar Accent -->
    <linearGradient id="crossBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Radial Ambient Lighting -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Ambient Light Reflection -->
  <circle cx="256" cy="240" r="180" fill="url(#centerGlow)"/>

  <!-- High-Contrast Geometric Monogram 'A' -->
  <g>
    <!-- Left Leg (Thick, High Contrast Vector) -->
    <path d="M 256 100 L 138 376 C 135 383 140 390 148 390 L 198 390 C 204 390 209 386 211 381 L 244 300 L 256 268 L 256 100 Z" fill="url(#leftStem)"/>

    <!-- Right Leg (Sleek Interlocking Vector) -->
    <path d="M 256 100 L 374 376 C 377 383 372 390 364 390 L 314 390 C 308 390 303 386 301 381 L 268 300 L 256 268 L 256 100 Z" fill="url(#rightStem)"/>

    <!-- Laser Cyan-Violet Crossbar Bridge -->
    <path d="M 194 304 L 318 304" stroke="url(#crossBarGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Inner Core Triangular Cut Highlight -->
    <polygon points="256,155 224,242 288,242" fill="#080b12"/>

    <!-- Brand Cyan Glowing Accent Dot -->
    <circle cx="390" cy="380" r="16" fill="#22d3ee"/>
    <circle cx="390" cy="380" r="8" fill="#ffffff"/>
  </g>
</svg>
